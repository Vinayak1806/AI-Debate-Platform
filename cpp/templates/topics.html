<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topics - AI Debate and Dialogue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <h2>AI Debate &amp; Dialogue</h2>
        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('why_platform') }}">Why This Platform</a></li>
            <li><a href="{{ url_for('how_it_works') }}">How It Works</a></li>
            <li><a href="{{ url_for('features') }}">Features</a></li>
            <li><a href="{{ url_for('topics') }}" class="active">Debate Topics</a></li>
            <li><a href="{{ url_for('profile') }}">Profile</a></li>
        </ul>
        <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
    </nav>

    <div class="main-content">
        <div class="topics-page-container">

            <!-- PAGE TITLE -->
            <h1 class="topics-title">Debate Topics</h1>
            <p class="topics-subtitle">Choose a category, then pick a topic to start your debate.</p>

            <!-- SEARCH BAR -->
            <div class="search-section">
                <div class="search-input-wrapper">
                    <span class="material-icons search-icon">search</span>
                    <input type="text" id="topic-search" placeholder="Search any topic..." class="search-input">
                    <button type="button" id="mic-btn" class="mic-btn" title="Voice search">
                        <span class="material-icons">mic</span>
                    </button>
                    <button class="search-btn">Search</button>
                </div>
            </div>

            <!-- CATEGORY CARD GRID — built by topics.js -->
            <div class="category-grid" id="category-grid">
                <!-- cards injected here -->
            </div>

            <!-- TOPIC LIST PANEL — revealed when a category is clicked -->
            <div class="topic-panel" id="topic-panel" style="display:none;">
                <div class="topic-panel-header">
                    <span id="panel-title">Topics</span>
                    <button class="panel-close-btn" id="panel-close-btn" title="Close">✕</button>
                </div>
                <div class="topic-panel-grid" id="topic-panel-grid">
                    <!-- topic links injected here on click -->
                </div>
            </div>

            <!-- SEARCH RESULTS — only shown during an active search -->
            <div class="search-results" id="search-results" style="display:none;">
                <div class="search-results-list" id="search-results-list"></div>
            </div>

        </div>
    </div>

    <style>
        .topics-page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px 80px;
        }

        .topics-title {
            text-align: center;
            font-size: clamp(2.5rem, 6vw, 3.8rem);
            font-weight: 800;
            background: var(--gradient-premium);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .topics-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.15rem;
            margin-bottom: 48px;
            font-weight: 500;
        }

        /* ── SEARCH BAR ── */
        .search-section {
            display: flex;
            justify-content: center;
            margin-bottom: 60px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 40px;
            padding: 8px 8px 8px 24px;
            box-shadow: var(--shadow-premium);
            border: 1px solid rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 680px;
            transition: var(--transition);
        }

        .search-input-wrapper:focus-within {
            box-shadow: 0 10px 40px -10px rgba(165, 94, 234, 0.25);
            border-color: var(--accent-purple);
        }

        .search-icon {
            color: #94a3b8;
            margin-right: 8px;
            font-size: 20px;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: #1e293b;
            outline: none;
            padding: 10px 0;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .mic-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            color: #64748b;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            margin-right: 10px;
            margin-top: 0px;
        }

        .mic-btn:hover {
            color: #a855f7;
            background: white;
            box-shadow: 0 4px 10px rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.2);
        }

        .search-btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-top: 0px;
            margin-right: 12px;
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.35);
        }

        /* ── CATEGORY GRID ── */
        .category-grid {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        /* Subtle scrollbar for category grid */
        .category-grid::-webkit-scrollbar {
            height: 6px;
        }

        .category-grid::-webkit-scrollbar-track {
            background: transparent;
        }

        .category-grid::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        .cat-card {
            flex: 0 0 auto;
            width: 160px;
            scroll-snap-align: start;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            user-select: none;
        }

        .cat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: rgba(168, 85, 247, 0.3);
        }

        .cat-card.active {
            border-color: var(--accent-purple);
            background: rgba(168, 85, 247, 0.05);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.2);
        }

        .cat-card .cat-emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        .cat-card .cat-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: #1e293b;
            line-height: 1.3;
        }

        .cat-card .cat-count {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* ── TOPIC PANEL ── */
        .topic-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
            overflow: hidden;
            animation: panelSlideIn 0.25s ease-out;
        }

        @keyframes panelSlideIn {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .topic-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
        }

        #panel-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .panel-close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .panel-close-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .topic-panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            padding: 20px 24px;
            max-height: 480px;
            overflow-y: auto;
        }

        .topic-link-card {
            display: block;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            border-left: 4px solid var(--accent-purple);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            line-height: 1.4;
            transition: var(--transition);
        }

        .topic-link-card:hover {
            background: var(--gradient-soft);
            color: white;
            border-left-color: transparent;
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }

        /* ── SEARCH RESULTS ── */
        .search-results {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            padding: 20px 24px;
            margin-bottom: 32px;
        }

        .search-result-section {
            margin-bottom: 20px;
        }

        .search-result-section h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 10px;
        }

        .search-result-topics {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .no-results {
            text-align: center;
            color: #94a3b8;
            padding: 40px 0;
            font-size: 1rem;
        }
    </style>

    <script src="{{ url_for('static', filename='topics-data.js') }}"></script>
    <script src="{{ url_for('static', filename='topics.js') }}"></script>
    {% include 'footer.html' %}
</body>

</html>
