<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Debate and Dialogue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body auth-page">

    <div class="main-content">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Join Our Community</h1>
                    <p>Create your account to start mastering communication</p>
                </div>

                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Choose a username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Create a password">
                    </div>

                    <button type="submit" class="auth-btn">Create Account</button>
                </form>

                <div class="auth-links">
                    <p>Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
                </div>
            </div>

            <div class="auth-features">
                <div class="feature-highlight">
                    <span class="highlight-icon">🚀</span>
                    <span>Free to Start</span>
                </div>
                <div class="feature-highlight">
                    <span class="highlight-icon">🎓</span>
                    <span>Learn & Grow</span>
                </div>
                <div class="feature-highlight">
                    <span class="highlight-icon">🏆</span>
                    <span>Achieve Excellence</span>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
